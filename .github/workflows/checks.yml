name: Chronos checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install browser test tools
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Node checks
        run: node --test
      - name: Standalone build
        run: node tools/build-standalone.mjs
      - name: Dimensions and themes
        run: python -u tests/chronos-dimensions.browser.py
      - name: Header popovers
        run: python -u tests/chronos-popovers.browser.py
      - name: Review regressions
        run: python -u tests/chronos-review-regressions.browser.py
      - name: Compact UI and action colors
        run: python -u tests/chronos-compact-ui.browser.py
      - name: Search and history geometry
        run: python -u tests/chronos-release-ui.browser.py
      - name: Public demo and storage isolation
        run: python -u tests/chronos-demo.browser.py
